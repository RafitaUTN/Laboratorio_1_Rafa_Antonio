# Inventario del Lab 1 (ITIEL-13 · Grupo 01 · III-2026).
#
# NUNCA se guardan contraseñas acá. Se leen de variables de entorno:
#   LAB_PASS_MT_LAB     -> MikroTik  (nombre "mt-lab"  -> MT_LAB)
#   LAB_PASS_CISCO_LAB  -> Cisco     (nombre "cisco-lab" -> CISCO_LAB)
# Si la variable no existe, el script la pide por consola con getpass.
#
# Campos por equipo:
#   nombre       nombre corto del equipo (define la variable de entorno)
#   host         IP administrativa
#   port         puerto SSH
#   device_type  driver de Netmiko (agregar otro fabricante = otra entrada)
#   usuario      usuario SSH
#   rol          "lectura" (solo consulta) o "escritura" (puede configurar)
#   credencial   (opcional) nombre del equipo cuya variable LAB_PASS_* se
#                reutiliza, para no repetir el secreto en otra entrada.

equipos:
  - nombre: mt-lab
    host: 10.60.30.202
    port: 22
    device_type: mikrotik_routeros
    usuario: lab-ssh
    rol: escritura

  - nombre: cisco-lab
    host: 10.60.30.203
    port: 22
    device_type: cisco_ios
    usuario: lab-ssh
    rol: lectura

  # EXTRA (+10): el MISMO MikroTik, consultado por su API REST (/rest, JSON
  # sobre HTTPS con certificado autofirmado). Coexiste con la entrada SSH.
  - nombre: mt-lab-rest
    host: 10.60.30.202
    port: 443
    device_type: mikrotik_rest
    usuario: lab-ssh
    rol: lectura
    credencial: mt-lab        # reutiliza LAB_PASS_MT_LAB (no duplica el secreto)

